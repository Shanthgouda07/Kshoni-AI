<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEco" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgEco)" />

  <!-- Rapid Rail Loading Silo / First Mile Conveyor Structure -->
  <rect x="750" y="180" width="160" height="320" fill="#1E293B" stroke="#10B981" stroke-width="2" rx="10" />
  <polygon points="750,500 830,580 910,500" fill="#0F172A" stroke="#10B981" stroke-width="2" />
  
  <!-- Enclosed Conveyor Belt Bridge -->
  <line x1="100" y1="360" x2="750" y2="240" stroke="#D4A843" stroke-width="24" stroke-linecap="round" />
  <line x1="100" y1="360" x2="750" y2="240" stroke="#0F172A" stroke-width="12" stroke-linecap="round" />

  <!-- Railway Track & Freight Train Wagon -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#94A3B8" stroke-width="6" />
  <line x1="0" y1="610" x2="1200" y2="610" stroke="#94A3B8" stroke-width="6" />
  <rect x="760" y="540" width="140" height="55" fill="#B45309" rx="4" stroke="#020617" stroke-width="2" />

  <!-- Eco-Park Greenery Trees -->
  <circle cx="200" cy="520" r="45" fill="#10B981" opacity="0.8" />
  <circle cx="260" cy="500" r="55" fill="#059669" opacity="0.9" />
  <circle cx="330" cy="530" r="40" fill="#10B981" opacity="0.8" />
  <circle cx="450" cy="510" r="60" fill="#047857" opacity="0.9" />

  <!-- Overlay Banner -->
  <rect x="50" y="45" width="530" height="110" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#10B981" stroke-width="1.5" />
  <text x="70" y="80" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="20">First Mile Connectivity (FMC) &amp; Eco-Restoration</text>
  <text x="70" y="110" fill="#E2E8F0" font-family="sans-serif" font-size="14">Rapid Rail Silo Loading &amp; Mine Reclamation Eco-Parks</text>
  <text x="70" y="135" fill="#F59E0B" font-family="sans-serif" font-weight="600" font-size="13">🌱 85% Reduction in Road Transport Dust &amp; Net-Zero Carbon Mission</text>
</svg>
