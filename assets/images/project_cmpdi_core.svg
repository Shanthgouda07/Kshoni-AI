    <rect x="260" y="200" width="80" height="300" rx="40" fill="rgba(56, 189, 248, 0.1)" stroke="#38BDF8" stroke-width="2" />
    <rect x="420" y="160" width="80" height="340" rx="40" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="2" />
    <rect x="580" y="220" width="80" height="280" rx="40" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="2" />
    <rect x="740" y="180" width="80" height="320" rx="40" fill="rgba(139, 92, 246, 0.1)" stroke="#8B5CF6" stroke-width="2" />
  </g>

  <!-- Core Strata Banding -->
