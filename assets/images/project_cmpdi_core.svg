  <text x="70" y="80" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="20">CMPDI Digital Twin &amp; Core Logging Repository</text>
  <text x="70" y="110" fill="#E2E8F0" font-family="sans-serif" font-size="14">HQ Ranchi Core Laboratory &amp; UNFC Vectorization</text>
