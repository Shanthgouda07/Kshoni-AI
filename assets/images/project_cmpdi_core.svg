  <rect x="260" y="320" width="80" height="60" fill="#D4A843" opacity="0.8" />
  <rect x="420" y="220" width="80" height="50" fill="#D4A843" opacity="0.8" />
  <rect x="420" y="360" width="80" height="80" fill="#020617" opacity="0.9" />
  <rect x="580" y="300" width="80" height="70" fill="#10B981" opacity="0.8" />

