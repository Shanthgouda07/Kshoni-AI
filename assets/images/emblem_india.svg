<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D4A843" />
      <stop offset="100%" stop-color="#B58929" />
    </linearGradient>
  </defs>
  <!-- Ashoka Lions Motif -->
  <g fill="url(#goldGrad)">
    <!-- Central Lion Head -->
    <path d="M 60,10 C 50,10 42,20 42,32 C 42,42 48,50 60,55 C 72,50 78,42 78,32 C 78,20 70,10 60,10 Z"/>
    <circle cx="53" cy="28" r="3" fill="#0A1628"/>
    <circle cx="67" cy="28" r="3" fill="#0A1628"/>
    <path d="M 54,40 Q 60,46 66,40" stroke="#0A1628" stroke-width="2" fill="none"/>

    <!-- Left & Right Lions -->
    <path d="M 38,25 C 28,25 22,35 25,48 C 28,58 38,62 46,58 Z"/>
    <path d="M 82,25 C 92,25 98,35 95,48 C 92,58 82,62 74,58 Z"/>

    <!-- Abacus Base Pedestal -->
    <rect x="20" y="66" width="80" height="16" rx="3" fill="url(#goldGrad)"/>
    
    <!-- Ashoka Chakra Wheel -->
    <circle cx="60" cy="74" r="7" fill="#000080" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="60" cy="74" r="2" fill="#FFF"/>

    <!-- Bull & Horse Accents -->
    <path d="M 30,70 Q 35,68 40,74" stroke="#0A1628" stroke-width="1.5" fill="none"/>
    <path d="M 80,70 Q 85,68 90,74" stroke="#0A1628" stroke-width="1.5" fill="none"/>

    <!-- Bell Shaped Lotus Base -->
    <path d="M 25,86 C 25,86 35,115 60,115 C 85,115 95,86 95,86 Z"/>
    <line x1="15" y1="118" x2="105" y2="118" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Satyameva Jayate Devnagari Inscription -->
    <text x="60" y="136" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#D4A843" letter-spacing="1">सत्यमेव जयते</text>
    <text x="60" y="148" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#94A3B8" letter-spacing="1">SATYAMEVA JAYATE</text>
  </g>
</svg>
