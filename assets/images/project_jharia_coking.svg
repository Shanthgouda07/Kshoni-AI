<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyJharia" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="coalStrata" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="1200" height="675" fill="url(#skyJharia)" />

  <!-- Distant Industrial Headframe / Mining Shaft Towers -->
  <polygon points="200,450 240,150 280,150 320,450" fill="#1E293B" stroke="#475569" stroke-width="2" />
  <line x1="240" y1="180" x2="280" y2="180" stroke="#D4A843" stroke-width="4" />
  <circle cx="260" cy="180" r="18" fill="none" stroke="#D4A843" stroke-width="3" />
  
  <polygon points="900,480 930,220 960,220 990,480" fill="#1E293B" stroke="#475569" stroke-width="2" />

  <!-- Subsurface Deep Seam Cross-Section (Jharia Seam IX/X) -->
  <path d="M0,350 Q300,320 600,360 Q900,400 1200,340 L1200,675 L0,675 Z" fill="url(#coalStrata)" />
  <path d="M0,420 Q400,390 800,440 Q1000,450 1200,410 L1200,520 Q900,560 500,510 L0,550 Z" fill="#D4A843" opacity="0.35" />

  <!-- Borehole Laser Telemetry Grid -->
  <line x1="450" y1="0" x2="450" y2="675" stroke="#10B981" stroke-width="2" stroke-dasharray="8 6" />
  <line x1="750" y1="0" x2="750" y2="675" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 6" />
  <rect x="420" y="440" width="60" height="120" fill="none" stroke="#10B981" stroke-width="2" />

  <!-- Mining Dump Trucks / Excavator Silhouettes -->
  <rect x="580" y="320" width="90" height="40" rx="6" fill="#D4A843" />
  <circle cx="600" cy="365" r="14" fill="#020617" stroke="#94A3B8" stroke-width="3" />
  <circle cx="650" cy="365" r="14" fill="#020617" stroke="#94A3B8" stroke-width="3" />

  <!-- Glowing Overlay Data HUD -->
  <rect x="50" y="45" width="460" height="110" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#D4A843" stroke-width="1.5" />
  <text x="70" y="80" fill="#F59E0B" font-family="sans-serif" font-weight="bold" font-size="20">BCCL Jharia Coking Coal Project</text>
  <text x="70" y="110" fill="#CBD5E1" font-family="sans-serif" font-size="14">UNFC 111 Proved Reserves: 14.85 Billion Tonnes</text>
  <text x="70" y="135" fill="#10B981" font-family="sans-serif" font-weight="600" font-size="13">✓ Seam IX/X Coking Quality • DGMS Barrier Monitored</text>
</svg>
