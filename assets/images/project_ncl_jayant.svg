<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyNcl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="pitGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="40%" stop-color="#451A03" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#skyNcl)" />

  <!-- Terraced Pit Benches (NCL Singrauli Open Cast Terraces) -->
  <polygon points="0,200 1200,280 1200,675 0,675" fill="url(#pitGround)" />
  <polygon points="0,280 1200,340 1200,380 0,320" fill="#B45309" opacity="0.6" />
  <polygon points="0,380 1200,430 1200,480 0,430" fill="#78350F" opacity="0.8" />
  <polygon points="0,480 1200,520 1200,675 0,675" fill="#1E293B" />

  <!-- Massive Dragline Excavator Boom Silhouette (Jayant Mine Dragline) -->
  <polygon points="750,420 780,220 860,220 890,420" fill="#0F172A" stroke="#D4A843" stroke-width="2" />
  <!-- Dragline Boom Arm -->
  <line x1="820" y1="230" x2="1080" y2="90" stroke="#D4A843" stroke-width="12" />
  <line x1="820" y1="250" x2="1080" y2="90" stroke="#0F172A" stroke-width="6" />
  <!-- Cable & Bucket -->
  <line x1="1080" y1="90" x2="1080" y2="280" stroke="#020617" stroke-width="3" />
  <polygon points="1040,280 1110,280 1100,340 1030,340" fill="#D4A843" stroke="#0F172A" stroke-width="3" />

  <!-- Haul Trucks on Terraces -->
  <rect x="250" y="340" width="80" height="35" rx="5" fill="#F59E0B" />
  <circle cx="270" cy="380" r="12" fill="#020617" />
  <circle cx="310" cy="380" r="12" fill="#020617" />

  <!-- Overlay Banner -->
  <rect x="50" y="45" width="480" height="110" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="#38BDF8" stroke-width="1.5" />
  <text x="70" y="80" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="20">NCL Jayant &amp; Nigahi Dragline Complex</text>
  <text x="70" y="110" fill="#E2E8F0" font-family="sans-serif" font-size="14">Singrauli Mega Opencast Coalfield (MP &amp; UP)</text>
  <text x="70" y="135" fill="#F59E0B" font-family="sans-serif" font-weight="600" font-size="13">⚡ 24x7 Dragline Heavy Machinery Excavating Seam Purewa</text>
</svg>
