<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A843" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4A843" stop-opacity="0.1" />
    </linearGradient>
    <filter id="coalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Polygon Coal Lump Shape -->
  <path d="M 50,8 L 78,20 L 92,45 L 85,78 L 58,92 L 25,85 L 8,60 L 15,30 Z" 
        fill="url(#coalGrad)" 
        stroke="#D4A843" 
        stroke-width="2.5" 
        filter="url(#coalGlow)"/>

  <!-- Coal Crystal Facet Lines (Coking Shimmer) -->
  <polygon points="50,8 78,20 62,48 38,35" fill="rgba(255,255,255,0.08)" stroke="#64748B" stroke-width="1.2"/>
  <polygon points="78,20 92,45 68,62 62,48" fill="rgba(255,255,255,0.03)" stroke="#475569" stroke-width="1.2"/>
  <polygon points="62,48 68,62 58,92 40,70" fill="rgba(0,0,0,0.4)" stroke="#334155" stroke-width="1.2"/>
  <polygon points="38,35 62,48 40,70 25,85 15,30" fill="rgba(212,168,67,0.12)" stroke="#D4A843" stroke-width="1.2"/>

  <!-- Golden Quality Vein Sparkles -->
  <line x1="38" y1="35" x2="62" y2="48" stroke="url(#facetHighlight)" stroke-width="2"/>
  <line x1="62" y1="48" x2="68" y2="62" stroke="url(#facetHighlight)" stroke-width="1.8"/>
  <circle cx="62" cy="48" r="3" fill="#D4A843"/>
  <circle cx="38" cy="35" r="2" fill="#10B981"/>
</svg>
