<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="kshoniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A843" />
      <stop offset="50%" stop-color="#B58929" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Gold Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#globeGrad)" stroke="url(#kshoniGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Latitude and Longitude Grid Lines -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(212,168,67,0.25)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <ellipse cx="60" cy="60" rx="42" ry="18" fill="none" stroke="rgba(212,168,67,0.3)" stroke-width="1.5"/>
  <ellipse cx="60" cy="60" rx="18" ry="42" fill="none" stroke="rgba(212,168,67,0.3)" stroke-width="1.5"/>
  <line x1="18" y1="60" x2="102" y2="60" stroke="rgba(212,168,67,0.35)" stroke-width="1.5"/>
  <line x1="60" y1="18" x2="60" y2="102" stroke="rgba(212,168,67,0.35)" stroke-width="1.5"/>

  <!-- Geological Strata Layers / Diamond Motif in Center -->
  <polygon points="60,28 88,60 60,92 32,60" fill="rgba(212,168,67,0.15)" stroke="url(#kshoniGrad)" stroke-width="2"/>
  <polygon points="60,38 78,60 60,82 42,60" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1.5"/>
  
  <!-- AI Sparkle Star Core -->
  <circle cx="60" cy="60" r="6" fill="#D4A843"/>
  <path d="M60 48 L63 57 L72 60 L63 63 L60 72 L57 63 L48 60 L57 57 Z" fill="#FFF"/>
  
  <!-- Sanskrit Crown Accent Points -->
  <circle cx="60" cy="18" r="3" fill="#10B981"/>
  <circle cx="102" cy="60" r="3" fill="#D4A843"/>
  <circle cx="60" cy="102" r="3" fill="#10B981"/>
  <circle cx="18" cy="60" r="3" fill="#D4A843"/>
</svg>
