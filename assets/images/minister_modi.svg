<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Realistic Photographic Lighting Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="skinModi" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <linearGradient id="jacketModi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="hairModi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D4A843" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Frame -->
  <circle cx="200" cy="200" r="192" fill="url(#bgGlow)" stroke="url(#goldBorder)" stroke-width="8" filter="url(#shadow)" />

  <!-- Soft Indian Flag Tricolor Ambient Backdrop -->
  <path d="M10,140 Q200,100 390,140 L390,200 Q200,240 10,200 Z" fill="#FF9933" opacity="0.12" />
  <path d="M10,200 Q200,240 390,200 L390,260 Q200,300 10,260 Z" fill="#138808" opacity="0.12" />

  <!-- Body / Attire (Nehru Jacket & White Kurta) -->
  <path d="M70,390 Q200,310 330,390 Z" fill="#F8FAFC" opacity="0.95" />
  <path d="M85,390 Q200,330 315,390 L315,400 L85,400 Z" fill="url(#jacketModi)" />
  <path d="M165,330 L235,330 L235,390 L165,390 Z" fill="#FFFFFF" />
  <!-- Nehru Collar -->
  <path d="M150,320 C150,300 250,300 250,320 L260,345 C260,345 140,345 140,345 Z" fill="#0F172A" stroke="#D4A843" stroke-width="1.5" />
  <circle cx="200" cy="365" r="4" fill="#D4A843" />

  <!-- Neck -->
  <path d="M165,260 L235,260 L240,320 L160,320 Z" fill="#D97706" />

  <!-- Head Base -->
  <ellipse cx="200" cy="210" rx="72" ry="88" fill="url(#skinModi)" />
  
  <!-- Ears -->
  <ellipse cx="125" cy="210" rx="14" ry="24" fill="#D97706" />
  <ellipse cx="275" cy="210" rx="14" ry="24" fill="#D97706" />

  <!-- Hair (Silver White Fine Cut) -->
  <path d="M130,175 C130,110 270,110 270,175 C270,150 250,130 200,128 C150,130 130,150 130,175 Z" fill="url(#hairModi)" />

  <!-- Beard & Mustache (Signature Modi White Beard) -->
  <path d="M135,210 C135,310 265,310 265,210 C250,285 150,285 135,210 Z" fill="url(#hairModi)" />
  <path d="M160,222 Q200,240 240,222 Q200,232 160,222 Z" fill="#FFFFFF" />

  <!-- Eyes & Eyebrows -->
  <path d="M158,180 Q175,174 190,180" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M210,180 Q225,174 242,180" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" />
  
  <ellipse cx="174" cy="190" rx="7" ry="5" fill="#1E293B" />
  <ellipse cx="226" cy="190" rx="7" ry="5" fill="#1E293B" />
  <circle cx="172" cy="188" r="2" fill="#FFFFFF" />
  <circle cx="224" cy="188" r="2" fill="#FFFFFF" />

  <!-- Spectacles / Glasses (Modi Rimless Frames) -->
  <rect x="156" y="180" width="36" height="22" rx="4" fill="none" stroke="#CBD5E1" stroke-width="2.5" />
  <rect x="208" y="180" width="36" height="22" rx="4" fill="none" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="192" y1="190" x2="208" y2="190" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="134" y1="188" x2="156" y2="188" stroke="#CBD5E1" stroke-width="2" />
  <line x1="244" y1="188" x2="266" y2="188" stroke="#CBD5E1" stroke-width="2" />

  <!-- Nose -->
  <path d="M196,190 L192,216 L208,216 L204,190 Z" fill="#D97706" opacity="0.4" />

  <!-- Smile / Mouth -->
  <path d="M178,236 Q200,248 222,236" stroke="#9A3412" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Lighting Overlay Overlay for Photorealistic Studio Glow -->
  <ellipse cx="170" cy="160" rx="50" ry="30" fill="#FFFFFF" opacity="0.08" />
</svg>
